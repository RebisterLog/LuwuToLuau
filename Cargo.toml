[package]
name = "luwu"
version = "0.1.1"
edition = "2021"
rust-version = "1.70"
description = "Transpiler from Luwu (.luwu) to plain Luau (.luau) for Roblox and Rojo projects"
license = "MIT"
readme = "README.md"
repository = "https://github.com/RebisterLog/LuwuToLuau"
homepage = "https://github.com/RebisterLog/LuwuToLuau"
keywords = ["luau", "luwu", "transpiler", "roblox", "rojo"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "luwu"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = "1.2.1"
