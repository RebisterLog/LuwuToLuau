name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            bin: luwu
            archive_ext: tar.gz
          - os: windows-latest
            target: windows-x86_64
            bin: luwu.exe
            archive_ext: zip
          - os: macos-latest
            target: macos-aarch64
            bin: luwu
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked --verbose

      - name: Build release
        run: cargo build --release --locked --verbose

      - name: Prepare assets (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="${{ matrix.bin }}"
          TARGET="${{ matrix.target }}"
          OUT_DIR="dist/${TARGET}"
          mkdir -p "$OUT_DIR"
          cp "target/release/${BIN_NAME}" "$OUT_DIR/${BIN_NAME}"
          cp README.md "$OUT_DIR/README.md"
          chmod +x "$OUT_DIR/${BIN_NAME}"
          cp "$OUT_DIR/${BIN_NAME}" "dist/luwu-${TARGET}"
          tar -C "$OUT_DIR" -czf "dist/luwu-${TARGET}.tar.gz" "${BIN_NAME}" README.md

      - name: Prepare assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binName = '${{ matrix.bin }}'
          $target = '${{ matrix.target }}'
          $outDir = "dist/$target"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item "target/release/$binName" "$outDir/$binName"
          Copy-Item "README.md" "$outDir/README.md"
          Copy-Item "$outDir/$binName" "dist/luwu-$target.exe"
          Compress-Archive -Path "$outDir/$binName", "$outDir/README.md" -DestinationPath "dist/luwu-$target.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luwu-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
