version = 1

[input]
# в этом репозитории исходники лежат в корне, а примеры, фикстуры и
# демо-проект компилировать не нужно
paths = ["."]
exclude = ["BuildExamples", "tests", "dist", "target", "ExampleRojoProject"]

[output]
dir = "build"
clean = false
# в этом репозитории ассеты переносить не нужно: build/ содержит только
# сгенерированный Luau
copy_assets = false

[watch]
debounce_ms = 400
