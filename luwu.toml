version = 1

[input]
# This repository keeps its sources in the root, so the examples, fixtures
# and demo project are excluded from the default build.
paths = ["."]
exclude = ["BuildExamples", "tests", "dist", "target", "ExampleRojoProject"]

[output]
dir = "build"
clean = false
# In this repository we only need the generated Luau in build/.
copy_assets = false

[watch]
debounce_ms = 400

