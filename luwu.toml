version = 1

[input]
paths = ["."]
exclude = ["target", "build", "dist", ".git", "node_modules"]

[output]
dir = "build"
clean = false
copy_assets = true

[watch]
debounce_ms = 400

[build]
# Diagnostics that block a build/check run: "default" | "all" | "syntax"
# | "contracts" | "types", or a list like ["syntax", "contracts", "types"].
fail_on = "default"

